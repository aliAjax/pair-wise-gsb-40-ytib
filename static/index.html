<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.gap{color:#a33}ul#gaps li{margin:4px 0}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th><th>计划版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th></tr></thead><tbody></tbody></table>
<h2>海况修订</h2><table id="revisions"><thead><tr><th>修订</th><th>事件</th><th>新海况</th><th>漂移(°/节)</th><th>生效时刻</th><th>状态</th><th>登记人</th><th>应用时刻</th></tr></thead><tbody></tbody></table>
<h2>修订处置明细</h2><table id="impacts"><thead><tr><th>修订</th><th>区域</th><th>处置</th><th>原船</th><th>接手船</th><th>改派状态</th></tr></thead><tbody></tbody></table>
<h2>当前缺口</h2><ul id="gaps"></ul>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
const ACT={released_replanned:'未出动·释放重排',released_unassigned:'未出动·释放待排',reassign_pending:'已出动·改派待接手',reassign_gap:'已出动·改派缺口'};
const RS={pending_takeover:'待接手确认',confirmed:'已接手',gap:'缺口'};
const RV={registered:'已登记',applied:'已应用',failed:'已失败'};
const GAPK={takeover_gap:'改派缺口（原船值守）',unassigned_gap:'重排缺口（区域空置）'};
async function load(){
const d=await fetch('/api/state').then(r=>r.json());
const rv=await fetch('/api/revisions').then(r=>r.json());
const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};
fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version','plan_version']);
fill('assets',d.assets,['name','kind','status','range_km']);
fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id']);
const revRows=rv.revisions.map(r=>({rev:'#'+r.revision_no,incident_id:r.incident_id,sea_state:r.sea_state,drift:r.drift_direction+'° / '+r.drift_speed_kn+'kn',effective_at:r.effective_at,status:RV[r.status]||r.status,created_by:r.created_by,applied_at:r.applied_at||'—'}));
fill('revisions',revRows,['rev','incident_id','sea_state','drift','effective_at','status','created_by','applied_at']);
const impRows=[];for(const r of rv.revisions){for(const i of r.impacts){impRows.push({rev:'#'+r.revision_no,area:i.area_code,action:ACT[i.action]||i.action,orig:i.original_asset_name||'—',repl:i.replacement_asset_name||'—',rs:RS[i.reassignment_status]||'—'})}}
fill('impacts',impRows,['rev','area','action','orig','repl','rs']);
document.querySelector('#gaps').innerHTML=rv.gaps.length?rv.gaps.map(g=>`<li class="gap">${GAPK[g.kind]||g.kind}：事件${g.incident_id} 区域${g.area_code}（修订#${g.revision_no}，原船 ${g.original_asset_name||'—'}）</li>`).join(''):'<li>无</li>';
document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('')}
load()</script></html>
